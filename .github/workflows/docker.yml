name: Tests and Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    # Runs on every push to main, tag and pull request. The image is only
    # built when the tests pass.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # same as the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    # Pull requests only run the tests, they never push an image.
    # Pushes to main only build when a pushed commit message contains "[build]".
    # Tags (v*) and manual runs (Actions -> Docker image -> Run workflow) always build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' &&
       contains(join(github.event.commits.*.message, ' '), '[build]'))
    # Repo variable RUNNER picks the runner: unset = GitHub-hosted,
    # "self-hosted" = your own runner (see docs/development.md).
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest = newest stable release tag (v1.2.3, not v1.2.3-beta1).
          # main = newest build from main ([build] commits or manual runs).
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Only amd64 for now. For more, add e.g. linux/arm64,linux/arm/v7 and
          # put back a docker/setup-qemu-action@v4 step before buildx.
          platforms: linux/amd64
          push: true
          # No provenance attestation: otherwise every push adds an untagged
          # index + attestation next to the image on the GHCR package page.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown in the web UI footer: tag (v1.0.0) or branch name + commit.
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
