services:
  estyma-proxy:
    # Published by .github/workflows/docker.yml
    image: ghcr.io/tabisch/estyma-local:latest
    # build: .   # uncomment to build locally instead
    restart: unless-stopped
    ports:
      # Host port (port 80 is often taken). The router redirects the
      # controller's traffic for provider_ip:80 to this port.
      - "${PROXY_PORT:-8088}:80"
      # Web UI to browse and download the logs: http://<host>:8089/
      # Logs contain device data, keep this port on your LAN.
      - "${UI_PORT:-8089}:8089"
    environment:
      # Provider server to forward to. The firewall DNAT rule only matches the
      # controller, so the provider's normal hostname works here.
      UPSTREAM: "http://igneo.pl:80"
      UPSTREAM_TIMEOUT: "30"
      # Optional basic auth for the log UI (set both in .env)
      UI_USER: "${UI_USER:-}"
      UI_PASSWORD: "${UI_PASSWORD:-}"
      # Local server, see README "Operating modes". Defaults keep today's
      # behaviour: forward only, no writes.
      MODE: "${MODE:-proxy}"                       # proxy | hybrid | local
      WRITES_ENABLED: "${WRITES_ENABLED:-0}"       # 1 = allow boiler target writes
      ALLOW_POWER_WRITES: "${ALLOW_POWER_WRITES:-0}"  # 1 = also allow boiler on/off
      LOCAL_FALLBACK: "${LOCAL_FALLBACK:-0}"       # 1 = answer locally when the cloud fails
      CLOUD_MIRROR: "${CLOUD_MIRROR:-0}"           # local mode: still send reports to the cloud
      CONTROLLER_TZ: "${CONTROLLER_TZ:-Europe/Warsaw}"
    volumes:
      - estyma-logs:/logs

volumes:
  # Named volume for the logs and state. Download the files via the log UI,
  # or: docker run --rm -v estyma-local_estyma-logs:/logs alpine ls /logs
  estyma-logs:
