# Every variable is described in docs/configuration.md.
services:
  estyma-proxy:
    # Published by .github/workflows/docker.yml
    image: ghcr.io/tabisch/estyma-local:latest
    # build: .   # uncomment to build locally instead
    restart: unless-stopped
    ports:
      # Host port (port 80 is often taken). The router redirects the
      # controller's traffic for provider_ip:80 to this port.
      - "${PROXY_PORT:-8088}:80"
      # Web UI to browse and download the logs: http://<host>:8089/
      # Logs contain device data, keep this port on your LAN.
      - "${UI_PORT:-8089}:8089"
    environment:
      # Provider server to forward to. The firewall DNAT rule only matches the
      # controller, so the provider's normal hostname works here.
      UPSTREAM: "http://igneo.pl:80"
      UPSTREAM_TIMEOUT: "30"
      # Optional basic auth for the log UI (set both in .env)
      UI_USER: "${UI_USER:-}"
      UI_PASSWORD: "${UI_PASSWORD:-}"
      # Local server, see docs/operating-modes.md. Defaults keep today's
      # behaviour: forward only, no writes.
      MODE: "${MODE:-proxy}"                       # proxy | hybrid | local
      WRITES_ENABLED: "${WRITES_ENABLED:-0}"       # 1 = allow boiler target writes
      ALLOW_POWER_WRITES: "${ALLOW_POWER_WRITES:-0}"  # 1 = also allow boiler on/off
      ALLOW_UNTESTED_WRITES: "${ALLOW_UNTESTED_WRITES:-0}"  # 1 = also allow the other settings (untested)
      SETTINGS_READ_MINUTES: "${SETTINGS_READ_MINUTES:-60}" # hybrid/local: re-read settings every n minutes
      LOCAL_FALLBACK: "${LOCAL_FALLBACK:-0}"       # 1 = answer locally when the cloud fails
      CLOUD_MIRROR: "${CLOUD_MIRROR:-0}"           # local mode: still send reports to the cloud
      CONTROLLER_TZ: "${CONTROLLER_TZ:-Europe/Warsaw}"
      # Optional cloud monitoring, switched on/off in the web UI. The cloud
      # account only comes from here; the UI never sees the credentials.
      ESTYMA_EMAIL: "${ESTYMA_EMAIL:-}"
      ESTYMA_PASSWORD: "${ESTYMA_PASSWORD:-}"
      ESTYMA_PASSWORD_B64: "${ESTYMA_PASSWORD_B64:-}"  # use if the password starts/ends with a space
      CLOUD_MONITOR: "${CLOUD_MONITOR:-0}"         # initial state until switched in the UI
      CLOUD_INTERVAL: "${CLOUD_INTERVAL:-30}"      # seconds between cloud polls
      # Optional MQTT publisher for Home Assistant (read-only, auto discovery).
      # Off while MQTT_HOST is empty. See docs/home-assistant.md.
      MQTT_HOST: "${MQTT_HOST:-}"                  # broker address, e.g. 192.168.1.10
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_USER: "${MQTT_USER:-}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
      MQTT_TLS: "${MQTT_TLS:-0}"                   # 1 = TLS; also set MQTT_PORT (usually 8883)
      MQTT_PREFIX: "${MQTT_PREFIX:-estyma}"
      MQTT_DEVICE_ID: "${MQTT_DEVICE_ID:-boiler}"
      MQTT_STALE_SECONDS: "${MQTT_STALE_SECONDS:-300}"
      HA_DISCOVERY_PREFIX: "${HA_DISCOVERY_PREFIX:-homeassistant}"
      FUEL_KWH_PER_KG: "${FUEL_KWH_PER_KG:-}"      # empty = controller setting, else 4.8
    volumes:
      - estyma-logs:/logs

volumes:
  # Named volume for the logs and state. Download the files via the log UI,
  # or: docker run --rm -v estyma-local_estyma-logs:/logs alpine ls /logs
  estyma-logs:
