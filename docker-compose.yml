services:
  estyma-proxy:
    # Published by .github/workflows/docker.yml
    image: ghcr.io/tabisch/estyma-local:latest
    # build: .   # uncomment to build locally instead
    restart: unless-stopped
    ports:
      # Host port (port 80 is often taken). The router redirects the
      # controller's traffic for provider_ip:80 to this port.
      - "${PROXY_PORT:-8088}:80"
      # Web UI to browse and download the logs: http://<host>:8089/
      # Logs contain device data, keep this port on your LAN.
      - "${UI_PORT:-8089}:8089"
    environment:
      # Real address of the provider's server. Use the IP if your DNS
      # override points the provider's hostname at this machine.
      UPSTREAM: "http://CHANGE-ME:80"
      UPSTREAM_TIMEOUT: "30"
      # Optional basic auth for the log UI (set both in .env)
      UI_USER: "${UI_USER:-}"
      UI_PASSWORD: "${UI_PASSWORD:-}"
    volumes:
      - estyma-logs:/logs

  # Polls the Estyma cloud through the EstymaApi wrapper and writes
  # cloud-YYYY-MM-DD.jsonl into the same logs volume as the proxy, for
  # compare/compare_cloud_proxy.py. Remove this service if you don't need it.
  # Opt-in: docker compose --profile cloud up -d
  cloud-recorder:
    profiles: ["cloud"]
    image: ghcr.io/tabisch/estyma-local:latest
    # build: .
    restart: unless-stopped
    command: ["python3", "/app/compare/cloud_recorder.py"]
    # ESTYMA_EMAIL and ESTYMA_PASSWORD go in .env next to this file
    # (not committed), see .env.example.
    environment:
      ESTYMA_EMAIL: "${ESTYMA_EMAIL:-}"
      ESTYMA_PASSWORD: "${ESTYMA_PASSWORD:-}"
      ESTYMA_DOMAIN: "igneo.pl"
      INTERVAL: "30"
    volumes:
      - estyma-logs:/logs

volumes:
  # Named volume shared by both services. Download the files via the log UI,
  # or: docker run --rm -v estyma-local_estyma-logs:/logs alpine ls /logs
  estyma-logs:
